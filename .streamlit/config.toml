[theme]
base = "light"
primaryColor = "#2176AE"
backgroundColor = "#F8FAFE"
secondaryBackgroundColor = "#EBF4FF"
textColor = "#1A2B4A"
font = "sans serif"

[server]
port = 8501
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[logger]
level = "error"
